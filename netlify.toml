[[headers]]
  for = "/*"
  [headers.values]
    # Evita que tu web se pueda incrustar en un iframe ajeno (clickjacking)
    X-Frame-Options = "DENY"

    # Evita que el navegador "adivine" tipos de archivo (protege contra ciertos XSS)
    X-Content-Type-Options = "nosniff"

    # Fuerza HTTPS en todas las visitas futuras, incluso si alguien escribe http://
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"

    # Controla cuánta información se envía a otros sitios cuando alguien hace click en un link saliente (ej. Ko-fi)
    Referrer-Policy = "strict-origin-when-cross-origin"

    # Desactiva APIs del navegador que tu web no usa (cámara, micrófono, geolocalización, etc.)
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

    # Content-Security-Policy: define qué puede cargar tu página y desde dónde
    # 'self' = solo desde tu propio dominio
    # unsafe-inline se permite en style/script porque tu web usa CSS y JS embebido en el mismo HTML
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
